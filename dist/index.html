<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Usage</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="notch">
    <div class="pill" data-tauri-drag-region="deep">
      <button class="provider" id="codex-btn" data-provider="codex" title="Codex">
        <span class="ring">
          <svg viewBox="0 0 36 36">
            <circle class="ring-bg" cx="18" cy="18" r="15"></circle>
            <circle class="ring-fg" id="codex-ring-fg" cx="18" cy="18" r="15"></circle>
            <image class="icon" href="icons/codex.svg" x="9" y="9" width="18" height="18"></image>
          </svg>
        </span>
        <span class="pct" id="codex-pct">—</span>
      </button>
      <div class="divider"></div>
      <button class="provider" id="claude-btn" data-provider="claude" title="Claude">
        <span class="ring">
          <svg viewBox="0 0 36 36">
            <circle class="ring-bg" cx="18" cy="18" r="15"></circle>
            <circle class="ring-fg" id="claude-ring-fg" cx="18" cy="18" r="15"></circle>
            <image class="icon" href="icons/claude.png" x="8" y="8" width="20" height="20" transform="rotate(90 18 18)"></image>
          </svg>
        </span>
        <span class="pct" id="claude-pct">—</span>
      </button>
      <div class="divider"></div>
      <button class="provider" id="copilot-btn" data-provider="copilot" title="Copilot">
        <span class="ring">
          <svg viewBox="0 0 36 36">
            <circle class="ring-bg" cx="18" cy="18" r="15"></circle>
            <circle class="ring-fg" id="copilot-ring-fg" cx="18" cy="18" r="15"></circle>
            <image class="icon" href="icons/copilot.webp" x="9" y="9" width="18" height="18" transform="rotate(90 18 18)"></image>
          </svg>
        </span>
        <span class="pct" id="copilot-pct">—</span>
      </button>
      <button class="settings-btn" id="settings-btn" title="Impostazioni">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path>
        </svg>
      </button>
    </div>
    <div class="detail" id="detail" hidden>
      <div class="detail-title" id="detail-title">—</div>
      <div id="detail-rows"></div>
      <div class="detail-error" id="detail-error" hidden></div>
    </div>
  </div>
<script src="main.js"></script>
</body>
</html>
