<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Impostazioni — AI Usage</title>
<link rel="stylesheet" href="settings.css" />
</head>
<body>
  <h1>Impostazioni</h1>

  <section>
    <h2>Provider attivi</h2>
    <label><input type="checkbox" id="active-claude" /> Claude</label>
    <label><input type="checkbox" id="active-codex" /> Codex</label>
    <label><input type="checkbox" id="active-copilot" /> Copilot</label>
    <label><input type="checkbox" id="active-gemini" /> Gemini</label>
  </section>

  <section>
    <h2>Refresh</h2>
    <label class="row">Intervallo (secondi)
      <input type="number" id="refresh-interval" min="30" step="10" />
    </label>
  </section>

  <section>
    <h2>Allerta</h2>
    <label class="row">Soglia (%)
      <input type="number" id="alert-threshold" min="1" max="100" />
    </label>
  </section>

  <section>
    <h2>Visibilità della pill</h2>
    <label class="row">Modalità
      <select id="pill-visibility-mode">
        <option value="always">Sempre visibile</option>
        <option value="auto_collapse">Auto-collapse</option>
      </select>
    </label>
    <label class="row" id="pill-collapse-delay-row">Collassa dopo (secondi)
      <input type="number" id="pill-collapse-delay" min="1" step="1" />
    </label>
  </section>

  <section>
    <h2>Sistema</h2>
    <label><input type="checkbox" id="autostart" /> Avvia al login</label>
  </section>

  <div class="actions">
    <button id="save-btn">Salva</button>
    <span class="hint" id="hint" hidden>Salvato — riavvia l'app per applicare provider/intervallo.</span>
  </div>

<script src="settings.js"></script>
</body>
</html>
