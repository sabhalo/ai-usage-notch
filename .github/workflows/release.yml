name: Release

# Un push di un tag `v*` builda su Windows e macOS e allega gli installer
# alla release GitHub corrispondente (plan/step-6.1.md). Nessun segreto
# richiesto: i test Rust girano offline su fixture (vedi plan/step-1.5.md),
# il bundling finale non tocca credenziali reali.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Installa Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test (offline, su fixture)
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Installa Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build bundle
        run: cargo tauri build ${{ matrix.args }}

      - name: Allega alla release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: false
